<div :id="cid_" class="">
    <div class="lu-app-header lu-app-header--responsive lu-navbar tssggs-head">
        <a :href="mainUrl_" class="tssggs-head__brand" v-if="moduleName_">
            <span class="tssggs-head__logo"><i class="mdi mdi-shield-check" aria-hidden="true"></i></span>
            <span class="tssggs-head__text"><strong>{{moduleName_}}</strong><small>SSL certificate management</small></span>
        </a>
        <a :href="mainUrl_ + '&mg-page=configuration'" class="tssggs-head__btn"><i class="mdi mdi-cog-outline" aria-hidden="true"></i><span>Installation</span></a>
        <button class="lu-navbar__burger lu-navbar-right lu-btn" data-target=".lu-app-navbar" data-toggle="offCanvas">
            <span class="lu-btn__icon lu-burger">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </button>
    </div>
    <div class="lu-app-navbar lu-navbar lu-navbar--responsive lu-off-canvas-responsive lu-off-canvas-responsive--right" v-if="navbar_.slots && (navbar_.slots.elements || moduleName_)">
        <component v-if="navbar_.slots && navbar_.slots.elements" v-bind="navbar_.slots" v-bind:is="navbar_.name" v-if="navbar_"></component>
    </div>
</div>
