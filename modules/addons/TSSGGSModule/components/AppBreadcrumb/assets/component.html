<div :id="cid_" class="lu-app-main__top lu-top tssggs-pagehead" v-if="list.length">
    <div class="tssggs-pagehead__crumb">
        <span v-if="module_">{{module_}}</span>
        <template v-for="(item, index) in list">
            <i class="mdi mdi-chevron-right" aria-hidden="true" v-if="module_ || index > 0"></i>
            <a :href="item.url" :aria-current="index == list.length - 1 ? 'page' : false">{{item.name}}</a>
        </template>
    </div>
    <h2 class="tssggs-pagehead__title">{{list[list.length - 1].name}}</h2>
</div>
