<date-picker
        :id="cid_"
        :name="name_"
        v-model="value_"
        value-type="format"
        :disabled="disabled_ == true"
        :ref="picker_"
        :format="format_"
        :type="type_"
        :placeholder="placeholder_"
        input-class="lu-form-control"
        :input-attr="{name: name_}"
        :range = "range_"
        :editable = "editable_"
        :clearable = "clearable_"
        :disabled-date="disabledDate"
        :disabled-time="disabledTime"
        :confirm="confirmButtonEnabled"
        @change="onChangeDate"
>
    <template #icon-calendar>
        <span class="tssggs-icobox" :class="getIconClass()"><svg class="tssggs-ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19,19H5V8H19M16,1V3H8V1H6V3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3H18V1M17,12H12V17H17V12Z"/></svg></span>
    </template>
    <template #icon-clear>
        <span class="lu-i-c-2x tssggs-icobox"><svg class="tssggs-ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/></svg></span>
    </template>
</date-picker>
