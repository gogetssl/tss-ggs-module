<div :id="cid_" class="lu-widget" :class="css_">
    <div class="lu-widget__body">
        <div class="lu-widget__content">
            <span class="lu-heading" v-if="title_">{{title_}}</span>
            <span v-if="description_" :data-title="description_" :aria-label="description_" :tooltip-id="tooltip_id_" class="lu-i-c-2x lu-form-tooltip-helper lu-tooltip tssggs-icobox"><svg class="tssggs-ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M11,18H13V16H11V18M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,6A4,4 0 0,0 8,10H10A2,2 0 0,1 12,8A2,2 0 0,1 14,10C14,12 11,11.75 11,15H13C13,12.75 16,12.5 16,10A4,4 0 0,0 12,6Z"/></svg></span>
            <div class="lu-rail lu-rail--space-between">
                <div v-if="elements_.leftSidebar">
                    <component
                            :key="element.uniq"
                            v-bind="element.slots"
                            v-on="$listeners"
                            v-bind:is="element.name"
                            v-for="(element, key) in elements_.leftSidebar"
                    >
                    </component>
                </div>
                <div class="lu-type-3 lu-text-truncate">
                    {{content_}}
                    <div v-if="elements_.elements" :class="elements_.elements && elements_.elements.length == 1 ? 'lu-single-element' : ''">
                        <component
                                :key="element.uniq"
                                v-bind="element.slots"
                                v-on="$listeners"
                                v-bind:is="element.name"
                                v-for="(element, key) in elements_.elements"
                        >
                        </component>
                    </div>
                </div>
                <div v-if="elements_.rightSidebar">
                    <component
                            :key="element.uniq"
                            v-bind="element.slots"
                            v-on="$listeners"
                            v-bind:is="element.name"
                            v-for="(element, key) in elements_.rightSidebar"
                    >
                    </component>
                </div>
            </div>
        </div>
        <div class="lu-widget__actions lu-widget__actions--raised" v-if="elements_.actions">
            <component
                    :key="element.uniq"
                    v-bind="element.slots"
                    v-on="$listeners"
                    v-bind:is="element.name"
                    v-for="(element, key) in elements_.actions"
            >
            </component>
        </div>
    </div>
</div>
